name: Deploy Client to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "projects/client/**"
      - "projects/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter client build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      # 预装 wrangler：wrangler-action 找不到时会用 npm 安装，而 npm 不支持 workspace:* 协议
      # 提前用 pnpm 全局安装，让 wrangler-action 直接使用已有的版本
      - name: Install Wrangler
        run: pnpm add -g wrangler

      # Pages 必须先构建再上传 dist，这里与本地 wrangler pages deploy 保持一致
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PAGES }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/client
          command: pages deploy dist --project-name=vocab-master-client
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
